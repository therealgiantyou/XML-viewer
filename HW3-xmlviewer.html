<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>XML Viewer</title>
        <link rel="stylesheet" href="HW3-xmlviewer.css">
    </head>
    <body>
        <h1>XML Viewer</h1>
        <input type="file" id="file-input" accept=".xml">
        <textarea id="xml-editor" placeholder="Edit or paste XML here..."></textarea>
        <button id="parse-btn">Parse XML</button>
        <button id="save-btn">Save XML</button>
        <div id="tree-container" class="tree"></div>
        <script src="HW3-xmlviewer.js"></script>
    </body>
</html>
